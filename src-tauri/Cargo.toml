[package]
name = "siev"
version = "1.0.0"
description = "SIEV - Sistema de Video-Oculografía"
authors = ["SIEV Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "siev_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Math & Processing
nalgebra = "0.33"
# Hardware
serialport = "4.6"
# Async & Utilities
tokio = { version = "1", features = ["full"] }
thiserror = "2"
ts-rs = "10.0" # Optional: for generating TypeScript types from Rust structs if needed later

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
