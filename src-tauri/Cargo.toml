[package]
name = "siev"
version = "1.0.0"
description = "SIEV - Sistema de Video-Oculografía"
authors = ["SIEV Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "siev_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Math & Processing
nalgebra = "0.33"
ndarray = "0.17"
image = "0.25"
imageproc = "0.25"
rayon = "1.10"
# AI/Inference
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
# Camera
nokhwa = { version = "0.10.4", features = ["input-v4l"] }
# Hardware
serialport = "4.6"
# Async & Utilities
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
bytes = "1"
base64 = "0.21"
thiserror = "2"
ts-rs = "10.0" # Optional: for generating TypeScript types from Rust structs if needed later
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
