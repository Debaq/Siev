[package]
name = "siev_vision_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "siev_vision_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py37"] }
numpy = "0.20"
ndarray = "0.15"
image = "0.24"
imageproc = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1