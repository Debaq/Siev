[package]
name = "siev-tracking"
description = "SIEV - pipeline de seguimiento pupilar (captura, ROI, detector, Kalman)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Matematica e imagen
nalgebra = "0.33"
ndarray = "0.17"
image = "0.25"
imageproc = "0.26"
zune-jpeg = "0.4"
zune-core = "0.4"
# Inferencia (YOLO de anclaje)
ort = { version = "=2.0.0-rc.11", features = ["ndarray"] }
# Camara
nokhwa = { version = "0.10.4", features = ["input-v4l"] }
v4l = "0.14"
# Video
openh264 = "0.6"
